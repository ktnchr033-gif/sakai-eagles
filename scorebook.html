<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>イーグルス スコアブック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 試合情報 → スコアボード → 罫線グリッドの打撃記録(左列固定・横スクロール) → 下部固定の操作バー */
:root{
  --paper:#f8faf8; --surface:#ffffff; --ink:#1b2621; --muted:#5a6d63;
  --rule:#9dbcaa; --rule-soft:#dce9e1; --accent:#1d6a43; --accent-ink:#ffffff;
  --run:#c3352b; --run-soft:#f6dcd9; --chip:#e8f1ec;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111714; --surface:#19211d; --ink:#e2ebe5; --muted:#93a99c;
  --rule:#3f5d4d; --rule-soft:#25352c; --accent:#5cc08a; --accent-ink:#0c1410;
  --run:#ff7468; --run-soft:#3d2120; --chip:#213028; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --surface:#19211d; --ink:#e2ebe5; --muted:#93a99c;
  --rule:#3f5d4d; --rule-soft:#25352c; --accent:#5cc08a; --accent-ink:#0c1410;
  --run:#ff7468; --run-soft:#3d2120; --chip:#213028; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--muted);letter-spacing:.12em;font-weight:500}
h2{font-size:.78rem;letter-spacing:.14em;color:var(--muted);margin:0 0 6px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.badge{font-size:.75rem;font-weight:700;background:var(--run-soft);color:var(--run);border-radius:4px;padding:3px 8px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--rule);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.line th,.line td{border:1px solid var(--rule-soft);padding:5px 0;text-align:center;min-width:34px;font-size:.95rem}
.line th{font-size:.72rem;color:var(--muted);font-weight:700}
.line td.team{text-align:left;padding:5px 10px;min-width:96px;font-weight:700;white-space:nowrap}
.line td.team span{color:var(--muted);font-weight:500;font-size:.75rem;margin-right:4px}
.line td.tot{font-weight:700;background:var(--chip)}
.line td.R{color:var(--run);font-size:1.1rem}
.line input{width:34px;border:0;background:transparent;text-align:center;padding:4px 0;font-variant-numeric:tabular-nums}
.grid th,.grid td{border:1px solid var(--rule-soft)}
.grid thead th{font-size:.72rem;color:var(--muted);font-weight:700;padding:4px 2px;background:var(--surface)}
.grid thead th .outs{display:block;color:var(--run);letter-spacing:1px;font-size:.6rem;height:.8rem}
.grid .nm{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1.5px solid var(--rule);min-width:112px;max-width:112px}
.grid td.nm button{all:unset;cursor:pointer;display:grid;grid-template-columns:18px 1fr;grid-template-rows:auto auto;column-gap:4px;padding:6px 8px;width:100%;box-sizing:border-box}
.grid td.nm .no{grid-row:span 4;font-family:var(--f-display);color:var(--accent);font-size:1rem;align-self:center}
.grid td.nm .pos{font-size:.68rem;color:var(--muted)}
.grid td.nm .pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid td.c{padding:0;width:70px;min-width:70px;height:70px;vertical-align:top}
.grid td.c button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%;height:100%;min-height:70px;padding:4px;box-sizing:border-box}
.grid td.c button:hover{background:var(--chip)}
.grid td.c button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pa{display:flex;align-items:center;gap:4px;line-height:1.1}
.pa svg{flex:none}
.pa .lb{font-weight:700;font-size:.82rem;white-space:nowrap}
.pa .lb.hit{color:var(--accent)}
.pa .rb{font-size:.62rem;color:var(--run);display:block;font-weight:700}
.empty{margin:auto;color:var(--rule);font-size:1.1rem}
.grid td.s{text-align:center;min-width:36px;padding:0 4px;font-size:.92rem}
.grid th.s{min-width:36px}
.grid .sep{border-left:1.5px solid var(--rule)}
.grid tfoot td{font-weight:700;background:var(--chip);padding:6px 4px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:8px 12px;font-size:.88rem;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--run);border-color:var(--run)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--rule);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bar .btn{padding:10px 4px;font-size:.82rem}
.legend{font-size:.75rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend b{color:var(--ink)}
/* sheet */
.ov{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-h h3{margin:0;font-size:1.05rem}
.x{border:0;background:none;font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts.nine{grid-template-columns:repeat(9,1fr)}
.opts.five{grid-template-columns:repeat(5,1fr)}
.opt{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:9px 2px;font-size:.82rem;font-weight:700;text-align:center}
.opt small{display:block;font-weight:400;font-size:.62rem;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt[aria-pressed="true"] small{color:inherit}
.opt:disabled{opacity:.35;cursor:not-allowed}
.grp-l{font-size:.68rem;color:var(--muted);font-weight:700;letter-spacing:.1em;margin:2px 0 4px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);font-size:1.2rem}
.step output{min-width:24px;text-align:center;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--rule);border-radius:8px;padding:8px 12px}
.preview .lb{font-size:1.15rem;font-weight:700}
.acts{display:flex;gap:8px}
.acts .btn{flex:1;padding:12px}
.gl{display:flex;flex-direction:column;gap:6px}
.gi{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:8px;padding:8px 10px}
.gi .t{flex:1;min-width:0}
.gi .t b{display:block}
.gi .t span{font-size:.75rem;color:var(--muted)}
.gi .sc{font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:150px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.85rem;font-weight:700;z-index:40}
.muted{color:var(--muted);font-size:.8rem}
.grid td.nm .sv{grid-column:2;font-size:.66rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.grid td.nm .sv b{color:var(--accent)}
.grid td.nm .subl{color:var(--run);font-weight:700}
.shd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:.78rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ss th,.ss td{border-bottom:1px solid var(--rule-soft);padding:7px 8px;text-align:right;white-space:nowrap;font-size:.88rem}
.ss th{font-size:.7rem;color:var(--muted);font-weight:700;background:var(--surface);position:sticky;top:0}
.ss td.l,.ss th.l{text-align:left;position:sticky;left:0;background:var(--surface)}
.ss td.l b{margin-right:6px;color:var(--accent);font-family:var(--f-display);font-weight:400}
.ss td.hi{color:var(--accent);font-weight:700}
.ss td.td{color:var(--run);font-weight:700}
.ss tr.none td{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--rule-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 8px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:.64rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.kv b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.roster{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow:auto}
.warnbox{background:var(--run-soft);color:var(--run);border-radius:6px;padding:8px 10px;font-size:.8rem;font-weight:700}
.exp{display:flex;flex-direction:column;gap:6px}
.exp textarea{min-height:96px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--rule-soft);border-radius:8px;overflow:hidden}
.prow.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.prow .sel{all:unset;cursor:pointer;flex:1;min-width:0;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.prow .sel:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.prow .pnm{font-weight:700;display:flex;gap:8px;align-items:baseline}
.prow .pnm small{font-size:.7rem;color:var(--muted);font-weight:500}
.prow .pnm .now{font-size:.66rem;color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:1px 6px}
.prow .pl{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.prow .pl b{color:var(--ink);font-weight:700}
.prow .ed{border:0;border-left:1px solid var(--rule-soft);background:none;padding:0 14px;color:var(--muted);font-size:.8rem;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pad button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 2px;font-weight:700;font-size:.86rem}
.pad button.o{background:var(--chip)}
.pad button.r{color:var(--run);border-color:var(--run)}
.pad button:active{transform:scale(.97)}
.pad .undo{grid-column:span 2;color:var(--muted)}
.pitchrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.pitchrow button{border:1.5px solid var(--rule);background:var(--surface);border-radius:10px;padding:16px 2px;font-weight:700;font-size:1rem}
.pitchrow button.st{border-color:var(--accent);color:var(--accent)}
.pitchrow button.bl{border-color:var(--muted)}
.pitchrow button:active{transform:scale(.97)}
.cnt{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;font-variant-numeric:tabular-nums}
.cnt .bso{display:flex;flex-direction:column;gap:3px}
.cnt .bso div{display:flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--muted)}
.cnt .bso i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--rule);display:inline-block}
.cnt .bso i.onB{background:var(--accent);border-color:var(--accent)}
.cnt .bso i.onS{background:#d9a21b;border-color:#d9a21b}
.cnt .bso i.onO{background:var(--run);border-color:var(--run)}
.cnt .bso span{width:12px}
.cnt .tot{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.cnt .tot b{display:block;color:var(--ink);font-size:1.15rem}
.sqc{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:.75rem;font-weight:700;border:1.5px solid var(--rule)}
.sqc.S,.sqc.F{border-color:var(--accent);color:var(--accent)}
.sqc.F{border-style:dashed}
.pa .sqn{display:block;font-size:.6rem;color:var(--muted)}
.hint{font-size:.72rem;color:var(--muted);margin:6px 0 0}
.padh{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:8px;flex-wrap:wrap}
.padh b{font-size:.95rem}
.stp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.stp .step{justify-content:space-between}
.stp .step button{width:36px;height:36px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><small>SAKAI EAGLES</small>イーグルス スコアブック</h1>
    <span class="badge" id="sampleBadge" hidden>サンプル試合（新しい試合で消えます）</span>
  </div>

  <section class="meta" aria-label="試合情報">
    <label class="f">日付<input type="date" id="m-date"></label>
    <label class="f">対戦相手<input type="text" id="m-opp" placeholder="例：〇〇ジュニア"></label>
    <label class="f">チーム<select id="m-team"><option>レギュラー</option><option>ジュニア</option><option>スーパージュニア</option></select></label>
    <label class="f">区分<select id="m-kind"><option>公式</option><option>OP</option></select></label>
    <label class="f">攻撃<select id="m-side"><option>先攻</option><option>後攻</option></select></label>
  </section>

  <section>
    <h2>スコアボード</h2>
    <div class="scroll"><table class="line" id="line"></table></div>
  </section>

  <section>
    <h2>打撃記録 <span class="muted" style="letter-spacing:0;font-weight:500">マスをタップして入力</span></h2>
    <div class="scroll"><table class="grid" id="grid"></table></div>
    <div class="addrow" style="margin-top:8px">
      <button class="btn" id="addInn">＋ 回を追加</button>
      <button class="btn" id="addBat">＋ 打者を追加</button>
    </div>
    <div class="legend" style="margin-top:10px">
      <span>ダイヤ線＝到達した塁</span><span><b style="color:var(--run)">赤塗り</b>＝得点</span><span><b>●</b>＝打点</span><span>盗死＝盗塁死（アウト数に加算）</span><span>見出しの●＝アウト数</span><span>名前の下＝シーズン打率 / 今日の成績</span>
    </div>
  </section>

  <section>
    <div class="shd">
      <h2>投手記録 <span class="muted" style="letter-spacing:0;font-weight:500">登板中の投手にボタンで加算</span></h2>
      <button class="btn" id="addP">＋ 投手を追加</button>
    </div>
    <div class="plist" id="plist" style="margin-top:6px"></div>
    <div id="padWrap"></div>
  </section>

  <section>
    <div class="shd">
      <h2>シーズン成績<span class="muted" style="letter-spacing:0;font-weight:500" id="ssNote"></span></h2>
      <div class="seg" role="group" aria-label="集計する試合"><button data-sf="all" id="sf-all">全試合</button><button data-sf="公式" id="sf-off">公式</button><button data-sf="OP" id="sf-op">OP</button></div>
    </div>
    <div class="scroll" style="margin-top:6px"><table class="ss" id="ss"></table></div>
    <div class="scroll" style="margin-top:10px"><table class="ss" id="ps"></table></div>
    <p class="muted" style="margin:6px 0 0">「今日込」はシーズン成績にこの試合を足した打率・防御率です。防御率は元アプリと同じ9回換算です。</p>
  </section>
</div>

<nav class="bar"><div class="in">
  <button class="btn pri" id="bSave">試合を保存</button>
  <button class="btn" id="bList">試合一覧</button>
  <button class="btn" id="bCsv">アプリへ送る</button>
  <button class="btn" id="bNew">新しい試合</button>
</div></nav>

let S=null;
function openPA(r,i,idx){

  S={r,i,idx,d:idx>=0?clone(l[idx]):{r:'',f:0,base:0,rbi:0,sb:0,sq:''}};S.d.sq=S.d.sq||'';S.d.cs=S.d.cs||0;S.d.who=S.d.who||batterAt(r,i);S.d.rn=S.d.rn||runnerAt(r,i,S.d.who);drawPA();

  <div class="preview">${d.r?diamond(d,34):''}<span class="lb">${d.r?esc(label(d)):'結果を選んでください'}</span></div>

    <div class="pitchrow" style="margin-top:0"><button class="st" data-sq="S">ストライク</button><button class="st" data-sq="F">ファウル</button><button class="bl" data-sq="B">ボール</button></div>
    <div class="chips" style="margin-top:6px;align-items:center">${d.sq?[...d.sq].map(c=>`<span class="sqc ${c}">${SQL[c]}</span>`).join(''):'<span class="muted">球数を付けない場合は空のままでOK</span>'}${d.sq?'<button class="chip" data-sq="-">1球消す</button>':''}</div></div>

sh.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset;
  if(a.act==='close')return closeSheet();
  if(!S)return;const d=S.d;
  if(a.chip!=null){const k=+a.chip,l=G.pa[S.r+'-'+S.i]||[];S.idx=k;S.d=k>=0?clone(l[k]):{r:'',f:0,base:0,rbi:0,sb:0,sq:''};S.d.sq=S.d.sq||'';S.d.cs=S.d.cs||0;S.d.who=S.d.who||batterAt(S.r,S.i);S.d.rn=S.d.rn||runnerAt(S.r,S.i,S.d.who);return drawPA()}
  if(a.res){const R=RES[a.res];d.r=a.res;d.base=R.base||0;if(!R.F)d.f=0;if(a.res==='HR'&&d.rbi<1)d.rbi=1;if(a.res==='SF'&&d.rbi<1)d.rbi=1;return drawPA()}
  if(a.who){const same=d.rn===d.who;d.who=a.who;if(same)d.rn=a.who;return drawPA()}
  if(a.rn){d.rn=a.rn;return drawPA()}
  if(a.f){d.f=d.f===+a.f?0:+a.f;return drawPA()}
  if(a.sq){if(a.sq==='-')d.sq=d.sq.slice(0,-1);else{d.sq+=a.sq;const c=cnt(d.sq);if(!d.r&&c.s>=3&&a.sq==='S'){d.r='K';d.base=0}if(!d.r&&c.b>=4){d.r='BB';d.base=1}}return drawPA()}
  if(a.base!=null){d.base=+a.base;return drawPA()}
  if(a.st){const[k,v]=a.st.split(':');d[k]=Math.max(0,Math.min(k==='rbi'?4:3,(d[k]||0)+ +v));if(k==='cs'&&+v>0&&d.base===4)d.base=0;return drawPA()}
  const key=S.r+'-'+S.i;
  if(a.act==='ok'){const l=G.pa[key]||(G.pa[key]=[]);if(S.idx>=0)l[S.idx]=d;else l.push(d);closeSheet();render()}
  if(a.act==='del'){const l=G.pa[key];l.splice(S.idx,1);if(!l.length)delete G.pa[key];closeSheet();render()}
});

      <div><span>安打</span><b>${z.h}</b></div><div><span>本塁打</span><b>${z.hr}</b></div><div><span>打点</span><b>${z.rbi}</b></div><div><span>盗塁(死)</span><b>${z.sb}<small class="muted">(${z.cs})</small></b></div></div>
      <div class="muted">今日 ${t.pa?`${t.ab}打数${t.h}安打 ${t.rbi}打点`:'まだ打席なし'}${vs?` ／ 対${esc(oppBase(G.game.opp))} 通算 ${vs.ab}打数${vs.h}安打（${f3(rates(vs).avg)}）`:''}</div></div>`

$('line').addEventListener('change',e=>{const t=e.target;if(t.dataset.oi!=null){const v=t.value.replace(/[^0-9]/g,'');G.opp[+t.dataset.oi]=v===''?'':+v;render()}});
['date','opp','team','kind','side'].forEach(k=>$('m-'+k).addEventListener('change',e=>{G.game[k]=e.target.value;if(G.sample&&k==='opp')G.sample=false;render()}));
$('addInn').onclick=()=>{G.innings++;render()};
$('addBat').onclick=()=>{G.players.push({name:'',pos:''});render();openPlayer(G.players.length-1)};

// ---- toast
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

// ---- save / list / new
const gkey=g=>`${g.game.date}|${g.game.opp}|${g.game.team}`;
function score(g){let e=0,o=0;for(const k in g.pa)g.pa[k].forEach(p=>{if(p.base===4)e++});(g.opp||[]).forEach(v=>o+=+v||0);return[e,o]}
$('bSave').onclick=()=>{if(!G.game.opp){toast('対戦相手を入力してください');$('m-opp').focus();return}
  G.sample=false;store.saved[gkey(G)]=clone(G);render();toast('保存しました')};
function drawList(){
  const items=Object.entries(store.saved).sort((a,b)=>b[0].localeCompare(a[0]));
  openSheet(`<div class="sh-h"><h3>保存した試合</h3><button class="x" data-act="close" aria-label="閉じる">×</button></div>
  <div class="gl">${items.length?items.map(([k,g])=>{const[e,o]=score(g);const res=e>o?'勝':e<o?'負':'分';
    return `<div class="gi"><div class="t"><b>vs ${esc(g.game.opp)}</b><span>${esc(g.game.date)} · ${esc(g.game.team)} · ${esc(g.game.kind)}</span></div><span class="sc">${e}-${o} ${res}</span><button class="btn" data-load="${esc(k)}">開く</button><button class="btn warn" data-delg="${esc(k)}">削除</button></div>`}).join(''):'<p class="muted">まだ保存した試合はありません。「試合を保存」で日付・相手・チームごとに残せます。</p>'}</div>`);
}
$('bList').onclick=()=>{S=null;drawList()};
sh.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.load){store.cur=G=fix(clone(store.saved[b.dataset.load]));closeSheet();render();toast('読み込みました')}
  if(b.dataset.delg){if(b.dataset.armed){delete store.saved[b.dataset.delg];persist();drawList();toast('削除しました')}else{b.dataset.armed='1';b.textContent='本当に削除'}}
});
$('bNew').onclick=function(){
  if(!this.dataset.armed){this.dataset.armed='1';this.textContent='打順を残して新規';setTimeout(()=>{delete this.dataset.armed;this.textContent='新しい試合'},3000);return}
  delete this.dataset.armed;this.textContent='新しい試合';
  const keep=G.players.map((p,r)=>{const h=slotP(r)[0];return{name:h.name,pos:h.pos}});const team=G.game.team,kind=G.game.kind;
  store.cur=G=blank(keep);G.game.team=team;G.game.kind=kind;render();toast('新しい試合を始めました');window.scrollTo({top:0});
};

// ---- CSV
function csv(){
  const head=['日付','相手','チーム','区分','打順','選手','守備','打席','打数','安打','二塁打','三塁打','本塁打','打点','得点','四球','死球','三振','犠打','犠飛','盗塁','盗塁死','見た球数','ファウル'];
  const rows=[head.join(',')];
  people().forEach(p=>{const r=p.r,s=personStat(p.name);if(!s.any)return;
    rows.push([G.game.date,G.game.opp,G.game.team,G.game.kind,r+1+(p.type!=='先発'?p.type:''),p.name,p.pos,s.pa,s.ab,s.h,s.d,s.t,s.hr,s.rbi,s.run,s.bb,s.hbp,s.so,s.sh,s.sf,s.sb,s.cs,s.np,s.fl].map(v=>/[,"]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(','))});
  if(G.pitch.length){rows.push('');rows.push(['日付','相手','チーム','区分','投手','役割','投球回','投球数','ストライク','うちファウル','ボール','ストライク率','被安打','被本塁打','四球','死球','奪三振','失点','自責点'].join(','));
    G.pitch.forEach(p=>rows.push([G.game.date,G.game.opp,G.game.team,G.game.kind,p.name,p.role,ipStr(p.outs),p.np,p.st,p.fl,p.bl,pct(p.st,p.st+p.bl),p.ha,p.hr,p.bb,p.hbp,p.k,p.r,p.er].join(',')))}
  return rows.join('\n');
}
// ---- eagles.html 用データ（GAME_RECORDS / SB_LOG と同じ書式）
const ARR={'ジュニア':['GAME_RECORDS','SB_LOG'],'レギュラー':['REG_GAME_RECORDS','REG_SB_LOG'],'スーパージュニア':['SJ_GAME_RECORDS','SJ_SB_LOG']};
const appDate=d=>{const[y,m,dd]=d.split('-').map(Number);return{s:`${y}/${m}/${dd}`,m}};
const q=s=>JSON.stringify(String(s));
function appRecords(){const{s,m}=appDate(G.game.date);const g=G.game;
  return people().map(p=>{const t=personStat(p.name);if(!t.any)return'';
    return `  {opponent:${q(g.opp)},player:${q(normName(p.name))},team:${q(g.team)},gameType:${q(g.kind)},date:${q(s)},month:${m},pa:${t.pa},ab:${t.ab},h:${t.h},single:${t.h-t.d-t.t-t.hr},d2:${t.d},d3:${t.t},hr:${t.hr},bb:${t.bb},hbp:${t.hbp},sf:${t.sf},sh:${t.sh},k:${t.so},rbi:${t.rbi},r:${t.run}},`}).filter(Boolean).join('\n')}
function appSB(){const g=G.game,out=[];
  G.players.forEach((p,r)=>{for(let i=1;i<=G.innings;i++)(G.pa[r+'-'+i]||[]).forEach(x=>{const rn=normName(rnOf(x,r,i));if((x.sb||x.cs)&&rn)out.push(`  {opponent:${q(g.opp)},player:${q(rn)},sb:${x.sb||0},cs:${x.cs||0},note:"${i}回",gameType:${q(g.kind)},team:${q(g.team)}},`)})});
  return out.join('\n')}
const PSUF={'ジュニア':'','レギュラー':'_REG','スーパージュニア':'_SJ'};
function pitchLog(){const g=G.game,[y,m,dd]=g.date.split('-').map(Number);
  return G.pitch.filter(p=>p.name).map(p=>`  {date:"${m}/${dd}",opponent:${q(g.opp)},name:${q(p.name)},role:${q(p.role)},gtype:${q(g.kind)},outs:${p.outs}, ip:"${ipStr(p.outs)}",ha:${p.ha},r:${p.r},er:${p.er},bb:${p.bb},hbp:${p.hbp},k:${p.k},hr:${p.hr}},`).join('\n')}
function pitchAgg(f){return G.pitch.filter(p=>p.name).map(p=>{const z=pAdd(pSeason(p.name,G.game.team,f),p),R=prates(z),r2=(v,d)=>v==null?0:+v.toFixed(d);
  return `  {name:${q(p.name)},g:${z.g},gs:${z.gs},gf:${z.gf},outs:${z.outs},ip:"${ipStr(z.outs)}",ha:${z.ha},r:${z.r},er:${z.er},bb:${z.bb},hbp:${z.hbp},k:${z.k},hr:${z.hr},era:${r2(R.era,2)},whip:${r2(R.whip,3)},k9:${r2(R.k9,2)},bb9:${r2(R.bb9,2)}},`}).join('\n')}
$('bCsv').onclick=()=>{S=null;const g=G.game,[ga,sa]=ARR[g.team],{s}=appDate(g.date);
  const dup=SR.some(r=>r.team===g.team&&r.date===s&&oppBase(r.opponent)===oppBase(g.opp));
  const missing=G.players.some((p,r)=>!p.name&&pasOf(r).length);
  const rec=appRecords(),sb=appSB();
  openSheet(`<div class="sh-h"><h3>アプリへ送るデータ</h3><button class="x" data-act="close" aria-label="閉じる">×</button></div>
  ${!g.opp?'<div class="warnbox">対戦相手が未入力です。入力してから送ってください。</div>':''}
  ${dup?'<div class="warnbox">この試合（日付・相手・チーム）はすでにアプリに登録されています。二重登録に注意してください。</div>':''}
  ${missing?'<div class="warnbox">名前のない打順に記録があります。その行は出力されません。</div>':''}
  <div class="exp"><div class="shd"><div class="grp-l">打撃成績 → <b>${ga}</b> の末尾へ</div><button class="btn" data-copy="ex1">コピー</button></div><textarea id="ex1" readonly>${esc(rec)}</textarea></div>
  <div class="exp"><div class="shd"><div class="grp-l">盗塁・盗塁死 → <b>${sa}</b> の末尾へ</div><button class="btn" data-copy="ex2">コピー</button></div><textarea id="ex2" readonly>${esc(sb||'// この試合の盗塁・盗塁死はありません')}</textarea></div>
  ${G.pitch.length?`${g.team==='ジュニア'?`<div class="exp"><div class="shd"><div class="grp-l">投手（試合ログ） → <b>PITCH_LOG</b> の末尾へ</div><button class="btn" data-copy="ex4">コピー</button></div><textarea id="ex4" readonly>${esc(pitchLog())}</textarea></div>`:''}
  <div class="exp"><div class="shd"><div class="grp-l">投手（通算） → <b>PITCH_STATS${PSUF[g.team]}</b> の同じ名前の行と置き換え</div><button class="btn" data-copy="ex5">コピー</button></div><textarea id="ex5" readonly>${esc(pitchAgg('all'))}</textarea></div>
  <div class="exp"><div class="shd"><div class="grp-l">投手（${g.kind}） → <b>PITCH_STATS${PSUF[g.team]}${g.kind==='OP'?'_OP':'_OFFICIAL'}</b> の同じ名前の行と置き換え</div><button class="btn" data-copy="ex6">コピー</button></div><textarea id="ex6" readonly>${esc(pitchAgg(g.kind))}</textarea></div>
  <p class="muted" style="margin:0">投手の通算行は、取り込み済みのシーズン成績にこの試合を足した値です。新しい投手は配列の末尾に追加してください。先発・救援別の表は更新されません。</p>`:''}
  <div class="exp"><div class="shd"><div class="grp-l">CSV（表計算用）</div><button class="btn" data-copy="ex3">コピー</button></div><textarea id="ex3" readonly>${esc(csv())}</textarea></div>`);
};
sh.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const ta=$(b.dataset.copy);
  const sel=()=>{ta.focus();ta.select();toast('選択しました。長押しでコピーしてください')};
  try{navigator.clipboard.writeText(ta.value).then(()=>toast('コピーしました'),sel)}catch(x){sel()}});

render();
</script>

</body>
